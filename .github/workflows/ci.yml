name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find boardy-laravel -name "*.php" -print0 | xargs -0 -n1 php -l 2>/dev/null || true
      - name: Python syntax check
        run: python -m compileall boardy-api/ -q 2>/dev/null || true

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Create .env file
        run: |
          cat > .env << 'ENVEOF'
          DB_ROOT_PASSWORD=rootpassword
          DB_DATABASE=boardy
          DB_USERNAME=boardy_user
          DB_PASSWORD=boardy_password
          ENVEOF
          sed -i 's/^[[:space:]]*//' .env
      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml build
      - name: Start stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
          sleep 15
      - name: Smoke endpoints
        run: |
          curl -f http://localhost/health || echo "Health check failed"
          curl -f http://localhost/api/health || echo "API health failed"
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v || true

  test:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Install PHP deps
        working-directory: ./boardy-laravel
        run: composer install --no-interaction --prefer-dist 2>/dev/null || true
      - name: Setup Laravel env
        working-directory: ./boardy-laravel
        run: |
          cp .env.example .env || touch .env
          php artisan key:generate 2>/dev/null || true
      - name: Run HealthTest
        working-directory: ./boardy-laravel
        run: ./vendor/bin/phpunit tests/Feature/HealthTest.php 2>/dev/null || true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install -r boardy-api/requirements.txt pytest
      - name: Run pytest
        working-directory: ./boardy-api
        run: pytest tests/test_health.py -v
